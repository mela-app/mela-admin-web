name: admin-web-cd

# Builds the admin console, pushes it to GHCR, then restarts just the console
# on the production server. The API keeps serving throughout - see
# docs/deployment.md.
#
# Secrets (repository or organization): SERVER_HOST, SERVER_USER,
# SERVER_SSH_KEY (or SERVER_PASSWORD), SERVER_SSH_FINGERPRINT, DEPLOY_PATH.

on:
  push:
    branches:
      - main
    # What goes into the image - a docs or branding change deploys nothing.
    paths:
      - 'src/**'
      - 'public/**'
      - 'nginx/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cd.yml'
  workflow_dispatch:  # Redeploy the console unchanged, from the Actions tab

# One deploy of the console at a time.
concurrency:
  group: cd-production-admin
  cancel-in-progress: false

jobs:
  build-and-deploy-production:
    name: Build and deploy the admin console
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha,scope=mela-admin
          cache-to: type=gha,mode=max,scope=mela-admin
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/mela-admin:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/mela-admin:${{ github.sha }}

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          # A deploy key; the password is only a fallback while there is none.
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # The server's host key, so nothing else can pose as it.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script_stop: true
          script: |
            echo "Deploying the admin console..."

            # The server pulls with its own read-only registry login
            # (docs/deployment.md): no token of this job is left behind there.
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull admin
            # Only the console: --no-deps leaves the API and the rest alone.
            docker compose up -d --no-deps admin
            docker compose ps admin

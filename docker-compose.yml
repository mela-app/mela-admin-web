# The admin console's container, locally - the image production uses.
# Start the API first (mela-backend), then, with .env in place (copy
# .env.example):
#
#   docker compose up -d --build
#
# and open http://localhost:<ADMIN_PORT>. Its nginx proxies /v1 to
# API_UPSTREAM, so the console and the API share one origin, as the sign-in
# cookie needs.
services:
  meal-admin:
    image: ghcr.io/${REPO_OWNER:-mela-app}/mela-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-https://melaapi.kefta-ticket.com}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8081}:80'
